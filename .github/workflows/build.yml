name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Keystore (optional secret)
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > app/release.jks; echo "KS_PASS=$KS_PASS" >> $GITHUB_ENV; fi
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
      - name: Build
        run: gradle --no-daemon :app:assembleRelease
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk MoneyTasks-v1.0.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MoneyTasks-apk
          path: MoneyTasks-v1.0.${{ github.run_number }}.apk
      - name: Publish APK to apk branch (stable download link)
        run: |
          mkdir out && cp MoneyTasks-v1.0.${{ github.run_number }}.apk out/MoneyTasks.apk
          cd out
          echo "Build ${{ github.run_number }} - $(date -u +%Y-%m-%dT%H:%MZ) - ${{ github.sha }}" > VERSION.txt
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -qm "APK build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
