name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Keystore (optional secret)
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > app/release.jks; echo "KS_PASS=$KS_PASS" >> $GITHUB_ENV; fi
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
      - name: Build
        run: gradle --no-daemon :app:assembleRelease
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk MoneyTasks-v1.0.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MoneyTasks-apk
          path: MoneyTasks-v1.0.${{ github.run_number }}.apk
